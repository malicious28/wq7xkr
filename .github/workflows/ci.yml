name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check src tests
      - name: Ruff (format)
        run: uv run ruff format --check src tests
      - name: Mypy (strict)
        run: uv run mypy
      - name: Pytest (unit, property, integration, API; coverage gate 85%)
        run: uv run pytest

  frontend:
    name: Frontend (types, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  contract:
    name: API contract is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate OpenAPI spec and TypeScript types
        run: |
          cd backend && uv sync --frozen && uv run windesk openapi --out openapi.json
          cd ../frontend && npx -y openapi-typescript@7.13.0 ../backend/openapi.json -o src/api/schema.d.ts
      - name: Fail if the committed contract is stale
        run: git diff --exit-code -- backend/openapi.json frontend/src/api/schema.d.ts

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t windesk:ci .
      - name: Smoke test
        run: |
          docker run -d --name windesk -p 8000:8000 windesk:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break; sleep 1; done
          curl -fsS "localhost:8000/api/decision?delivery_date=2026-01-15" | grep -q '"publish_time"'
          curl -fsS localhost:8000/ | grep -q '<div id="root">'
          docker logs windesk
